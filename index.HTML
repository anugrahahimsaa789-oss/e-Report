<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>e-Report</title>
     <link rel="icon" type="image/x-icon" href="image/Ellipse 4.png">
    <link rel="stylesheet" href="src/output.css">
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-50 text-slate-800 antialiased min-h-screen pb-20 relative">

    <nav class="max-w-6xl mx-auto mb-8 bg-white/40 backdrop-blur-md border border-white/20 rounded-2xl shadow-sm px-6 py-4 flex items-center justify-center z-50 transition-all duration-300 relative">
        <div class="flex items-center gap-3 group cursor-pointer">
            <div class="w-10 h-10 bg-blue-100 text-blue-600 rounded-xl flex items-center justify-center font-black text-lg shadow-sm transform transition-transform group-hover:rotate-6">
                E
            </div>
            <span class="text-xl font-black tracking-tight text-blue-950">e-Report</span>
        </div>
    </nav>

    <header class="relative max-w-4xl mx-auto mb-16 px-4 text-center flex flex-col items-center justify-center z-10">
        <div class="inline-flex items-center gap-2 px-3 py-1.5 bg-blue-50 border border-blue-100 rounded-full mb-6">
            <span class="w-2 h-2 rounded-full bg-blue-500 animate-pulse"></span>
            <span class="text-xs font-bold text-blue-600 uppercase tracking-widest" style="font-family: 'JetBrains Mono', monospace;">Live Reporting Feed</span>
        </div>

        <h1 class="text-3xl md:text-5xl font-black text-blue-950 mb-4 tracking-tight leading-none uppercase">
            Sistem Informasi Berita Teknologi
        </h1>

        <p class="text-sm md:text-base text-slate-500 leading-relaxed max-w-2xl">
            Platform intelijen data yang memantau, mengompilasi, dan merangkum pergerakan ekosistem teknologi global secara real-time. Dilengkapi dengan filter pencarian prediktif super cepat.
        </p>
    </header>

    <main class="max-w-6xl mx-auto px-4 relative z-10">
        <div id="report-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8"></div>
    </main>

    <script src="script.js"></script>
</body>
